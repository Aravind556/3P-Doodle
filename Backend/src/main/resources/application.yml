spring:
  application:
    name: Backend
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      idle-timeout: 300000
      max-lifetime: 1800000
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${DB_ISSUER_URI}.supabase.co/auth/v1
  
app:
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    channel: ${REDIS_CHANNEL:whiteboard-events}
    room-channel: ${REDIS_ROOM_CHANNEL:room-events}

logging:
  level:
    org.springframework.security: DEBUG
